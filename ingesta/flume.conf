# Nombramiento de los componentes del agente a1
a1.sources = r1
a1.sinks = k1
a1.channels = c1

# Configuración del Source 
a1.sources.r1.type = spooldir
a1.sources.r1.spoolDir = /home/cloudera/workspace/steam
a1.sources.r1.fileHeader = true

# Configuración del Sink 
a1.sinks.k1.type = hdfs
a1.sinks.k1.hdfs.path = hdfs://localhost:8020/user/cloudera/proyecto/
a1.sinks.k1.hdfs.fileType = DataStream
a1.sinks.k1.hdfs.writeFormat = Text
a1.sinks.k1.hdfs.rollInterval = 0
a1.sinks.k1.hdfs.rollSize = 0
a1.sinks.k1.hdfs.rollCount = 0

# Configuración del Channel
a1.channels.c1.type = memory
a1.channels.c1.capacity = 10000
a1.channels.c1.transactionCapacity = 1000

# Vinculación del Source y el Sink mediante el Channel
a1.sources.r1.channels = c1
a1.sinks.k1.channel = c1